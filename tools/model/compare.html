<!doctype html><html lang="zh-CN"><meta charset="UTF-8"><title>S90 模型同条件对比</title><style>body{margin:0;background:#ede9e1}canvas{display:block}#state{position:fixed;left:20px;top:20px;font:14px sans-serif}</style><div id="state">载入中</div><script type="module">
import * as THREE from 'three';import{GLTFLoader}from'three/examples/jsm/loaders/GLTFLoader.js';import{MeshoptDecoder}from'three/examples/jsm/libs/meshopt_decoder.module.js';import{RoomEnvironment}from'three/examples/jsm/environments/RoomEnvironment.js';
const r=new THREE.WebGLRenderer({antialias:true});r.setSize(1600,900);r.setPixelRatio(1);r.toneMapping=THREE.ACESFilmicToneMapping;r.toneMappingExposure=1;document.body.appendChild(r.domElement);const scene=new THREE.Scene();scene.background=new THREE.Color('#ede9e1');scene.environment=new THREE.PMREMGenerator(r).fromScene(new RoomEnvironment(),.04).texture;const camera=new THREE.PerspectiveCamera(31,1600/900,.02,200);scene.add(new THREE.HemisphereLight(0xffffff,0x444444,1));let car;const l=new GLTFLoader().setMeshoptDecoder(MeshoptDecoder);const q=new URLSearchParams(location.search);const path=q.get('model')||'/assets/model/s90-opt.glb';
window.ready=false;const gltf=await l.loadAsync(path);car=gltf.scene;scene.add(car);car.traverse(o=>{if(!o.isMesh)return;for(const m of(Array.isArray(o.material)?o.material:[o.material])){if(m.name==='Car_Paint'){m.color.set('#696b6e');m.metalness=.82;m.roughness=.3;if('clearcoat'in m){m.clearcoat=1;m.clearcoatRoughness=.055}}if(m.name==='Glass'){m.transmission=0;m.opacity=.66;m.transparent=true;m.depthWrite=false;}}});
const box=new THREE.Box3().setFromObject(car);window.bounds={min:box.min.toArray(),max:box.max.toArray()};const poses={side:[[-19,.74,0],[0,.74,0],12],front:[[-6,1.7,7],[0,.65,.2],31],wheel:[[-3,.8,3],[-.9,.4,1.6],31],light:[[-2.9,1.15,4.4],[-.6,.75,2.1],31],cabin:[[-.25,1.18,-.65],[0,.96,1.15],65]};window.shot=(name)=>{let[p,t,f]=poses[name];camera.position.set(...p);camera.lookAt(...t);camera.fov=f;camera.updateProjectionMatrix();r.render(scene,camera);document.getElementById('state').textContent='';return {calls:r.info.render.calls,triangles:r.info.render.triangles}};await r.compileAsync(scene,camera);window.shot('side');window.ready=true;
</script></html>
